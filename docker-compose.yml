version: "3.9"

services:

  backend:
    image: ${DOCKERHUB_USERNAME}/insurance-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insurance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"          # Expose directly for health checks / debugging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_USERNAME}/insurance-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insurance_frontend
    restart: unless-stopped
    ports:
      - "80:80"              # Public HTTP port
    depends_on:
      backend:
        condition: service_healthy
