<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Insurance Premium Calculator</title>

</head>

<body>

    <!-- Header -->
    <div class="header">

        <h1>Insurance Premium Calculator</h1>

    </div>

    <!-- Main Content -->
    <div class="content">

        <!-- Prediction Form -->
        <form id="predictionForm">

            <!-- Age -->
            <label for="age">Age:</label>

            <input
                type="number"
                id="age"
                name="age"
                min="1"
                max="120"
                value="30"
                required
            >

            <!-- Weight -->
            <label for="weight">Weight (kg):</label>

            <input
                type="number"
                id="weight"
                name="weight"
                step="0.1"
                min="1"
                value="70.0"
                required
            >

            <!-- Height -->
            <label for="height">Height (m):</label>

            <input
                type="number"
                id="height"
                name="height"
                step="0.01"
                min="0.1"
                max="2.5"
                value="1.75"
                required
            >

            <!-- Income -->
            <label for="income_lpa">Income (LPA):</label>

            <input
                type="number"
                id="income_lpa"
                name="income_lpa"
                step="0.1"
                min="0.1"
                value="5.0"
                required
            >

            <!-- Smoker -->
            <label for="smoker">Smoker:</label>

            <select
                id="smoker"
                name="smoker"
                required
            >
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>

            <!-- City -->
            <label for="city">City:</label>

            <input
                type="text"
                id="city"
                name="city"
                value="Mumbai"
                required
            >

            <!-- Occupation -->
            <label for="occupation">Occupation:</label>

            <select
                id="occupation"
                name="occupation"
                required
            >
                <option value="retired">Retired</option>
                <option value="freelancer">Freelancer</option>
                <option value="student">Student</option>
                <option value="government_job">Government Job</option>
                <option value="business_owner">Business Owner</option>
                <option value="unemployed">Unemployed</option>
                <option value="private_job">Private Job</option>
            </select>

            <!-- Submit Button -->
            <input
                type="submit"
                value="Predict Premium Category"
            >

        </form>

        <!-- Prediction Result -->
        <div id="result"></div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
